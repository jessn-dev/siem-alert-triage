global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'rule_id']
  group_wait: 5s
  group_interval: 30s
  # Hours, not minutes. A re-notify loop is how on-call learns to ignore the pager.
  repeat_interval: 4h
  receiver: 'ticket_webhook'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'pager_webhook'
      # Critical detections re-notify faster than the default.
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: 'ticket_webhook'

inhibit_rules:
  # When the pipeline itself is down, its metrics go stale. Every metric-derived
  # alert then becomes noise about a cause we have already paged for.
  # CriticalSIEMDetection is deliberately NOT inhibited: a real detection that
  # fired just before the outage must still reach a human.
  - source_matchers:
      - alertname = "SIEMComponentDown"
    target_matchers:
      - alertname =~ "HighAlertVolume|MalformedLogsSpike|IngestionStalled|EventsRejectedSpike"
    equal: ['job']

receivers:
  - name: 'pager_webhook'
    webhook_configs:
      - url: 'http://webhook-receiver:8080/page'
        send_resolved: true
  - name: 'ticket_webhook'
    webhook_configs:
      - url: 'http://webhook-receiver:8080/ticket'
        send_resolved: true
